<style>
  /* ── apps launcher (portfolio of apps) ─────────────────────────────── */
  .apps-overlay { position: fixed; inset: 0; z-index: 320; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(0,0,0,.4); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .18s ease; }
  .apps-overlay.open { opacity: 1; pointer-events: auto; }
  .apps-modal { width: min(100%, 640px); max-height: 88vh; overflow: auto; padding: 1.35rem; border: 1px solid var(--border); border-radius: calc(var(--radius, 1.15rem) + .1rem); background: var(--surface-strong, #fffdf9); color: var(--text); box-shadow: var(--shadow, 0 18px 55px rgba(0,0,0,.2)); transform: translateY(12px) scale(.98); transition: transform .18s ease; }
  .apps-overlay.open .apps-modal { transform: translateY(0) scale(1); }
  .apps-head { display: flex; align-items: flex-start; justify-content: space-between; gap: .8rem; margin-bottom: 1.1rem; }
  .apps-head h2 { font-size: 1.25rem; letter-spacing: -.03em; margin: 0; }
  .apps-head p { color: var(--muted); font-size: .8rem; margin: .25rem 0 0; }
  .apps-close { width: 34px; height: 34px; min-height: 34px; padding: 0; border: 1px solid var(--border); border-radius: 50%; background: var(--surface-2); cursor: pointer; font-size: 1rem; color: var(--text); }
  .apps-close:hover { background: color-mix(in oklab, var(--surface-2) 70%, var(--primary) 30%); }
  .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .65rem; }
  .apps-tile { display: flex; align-items: center; gap: .75rem; padding: .8rem .85rem; border: 1px solid var(--border); border-radius: .95rem; background: color-mix(in oklab, var(--surface-strong, #fffdf9) 82%, var(--surface-2) 18%); color: var(--text); text-decoration: none; transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease; }
  a.apps-tile:hover { transform: translateY(-2px); border-color: color-mix(in oklab, var(--primary) 40%, var(--border)); box-shadow: var(--shadow-soft, 0 8px 24px rgba(42,42,32,.06)); }
  .apps-tile.current { opacity: .92; }
  .apps-tile-icon { width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; }
  .apps-tile-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .apps-tile-name { font-weight: 700; font-size: .92rem; display: flex; align-items: center; gap: .45rem; }
  .apps-tile-tag { color: var(--muted); font-size: .76rem; margin-top: 1px; }
  .apps-badge { font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--primary, #0f6a63); background: color-mix(in oklab, var(--primary, #0f6a63) 12%, var(--surface)); border: 1px solid color-mix(in oklab, var(--primary, #0f6a63) 30%, transparent); border-radius: 999px; padding: .12rem .45rem; }
  .apps-trigger-fixed { position: fixed; top: 1rem; right: 1rem; z-index: 200; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); backdrop-filter: blur(12px); transition: transform .16s ease; }
  .apps-trigger-fixed:hover { transform: translateY(-1px); }
  @media (max-width: 520px) { .apps-modal { padding: 1rem; } }
</style>

<div class="apps-overlay" id="apps-overlay" role="dialog" aria-modal="true" aria-labelledby="apps-title">
  <div class="apps-modal">
    <div class="apps-head">
      <div>
        <h2 id="apps-title">{{ t('apps.title') }}</h2>
        <p>{{ t('apps.subtitle') }}</p>
      </div>
      <button class="apps-close" id="apps-close" type="button" aria-label="{{ t('apps.close') }}">✕</button>
    </div>
    <div class="apps-grid" id="apps-grid"></div>
  </div>
</div>

<script>
  (() => {
    const APPS = {{ apps_list | tojson }};
    const CURRENT = {{ current_app_id | tojson }};
    const I18N = {{ i18n_dict(language) | tojson }};
    const t = (key) => I18N[key] ?? key;
    const BADGE = t('apps.here');
    const grid = document.getElementById('apps-grid');
    const overlay = document.getElementById('apps-overlay');

    const appUrl = (app) => {
      const prefixes = APPS.map(a => a.path).filter(Boolean);
      const here = window.location.pathname;
      const publicMode = prefixes.some(p => here === p || here.startsWith(p + '/'));
      if (publicMode) return window.location.origin + app.path + '/';
      return window.location.protocol + '//' + window.location.hostname + ':' + app.port + '/';
    };

    grid.innerHTML = APPS.map(app => {
      const isCurrent = app.id === CURRENT;
      const badge = isCurrent ? `<span class="apps-badge">${BADGE}</span>` : '';
      const inner = `<span class="apps-tile-icon" style="background:${app.color}">${app.icon}</span>` +
        `<span class="apps-tile-body"><span class="apps-tile-name">${app.name}${badge}</span><span class="apps-tile-tag">${app.tagline}</span></span>`;
      return isCurrent
        ? `<div class="apps-tile current">${inner}</div>`
        : `<a class="apps-tile" href="${appUrl(app)}">${inner}</a>`;
    }).join('');

    const open = () => overlay?.classList.add('open');
    const close = () => overlay?.classList.remove('open');
    document.querySelectorAll('[data-apps-trigger]').forEach(btn => btn.addEventListener('click', open));
    document.getElementById('apps-close')?.addEventListener('click', close);
    overlay?.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  })();
</script>
